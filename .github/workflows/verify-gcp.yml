name: Verify GitHub ↔ GCP

on:
  workflow_dispatch:

jobs:
  gcp-auth-check:
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      id-token: write  # Required for Workload Identity Federation

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/15940818582/locations/global/workloadIdentityPools/github-pool/providers/github-provider-v2'
          service_account: 'github-actions-sa@vega-qa-automation.iam.gserviceaccount.com'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Set GCP Project
        run: gcloud config set project vega-qa-automation

      - name: Verify Access
        run: |
          echo "🔹 Verifying GCP access..."
          gcloud projects describe vega-qa-automation

      - name: Print Success Message
        if: ${{ success() }}
        run: echo "✅ GitHub successfully authenticated with GCP!"
